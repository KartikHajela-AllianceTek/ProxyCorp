<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Meeting Scribe</title>
    <style>
        body { margin: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #status { color: #eee; font-size: 24px; display: flex; align-items: center; }
        .dot {
            display: inline-block; width: 16px; height: 16px; border-radius: 50%;
            background: #4caf50; margin-right: 12px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
    </style>
</head>
<body>
    <div id="status"><span class="dot"></span><span>Actively Listening...</span></div>
</body>
</html>
